<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prometheus AI — RAG Interface</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            color: #e6edf8;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .interface {
            width: min(100%, 1340px);
            height: 100vh;
            max-height: 100vh;
            border-radius: 0;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
            background: #000;
            border: none;
            box-shadow: none;
        }

        .panel {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            z-index: 1000;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            background: rgba(20, 20, 25, 0.98);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            overflow-y: auto;
        }

        .panel.show {
            display: flex;
        }

        .interface::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 999;
        }

        .interface:has(.panel.show)::before {
            display: block;
        }

        .panel h1,
        .panel h2 {
            margin: 0;
            color: #f8fafc;
            letter-spacing: -0.03em;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .brand h1 {
            font-size: 1.4rem;
            line-height: 1;
        }

        .brand p {
            margin: 0;
            color: #9aa7c4;
            line-height: 1.5;
            font-size: 0.75rem;
        }

        .panel .section {
            border-radius: 12px;
            padding: 12px;
            background: rgba(11, 14, 31, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .section h2 {
            font-size: 0.9rem;
            margin: 0 0 8px 0;
        }

        .field {
            display: grid;
            gap: 6px;
            margin-bottom: 8px;
        }

        .field label {
            font-size: 0.7rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #7c8bab;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            color: #e6edf8;
            padding: 8px 10px;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: rgba(86, 155, 255, 0.85);
        }

        .field textarea {
            min-height: 80px;
            resize: vertical;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #d2dbf1;
            font-size: 0.8rem;
        }

        .section .actions {
            display: grid;
            gap: 8px;
        }

        .button,
        .button-secondary {
            border-radius: 8px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 12px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .button {
            background: linear-gradient(135deg, #6e7bff 0%, #971fff 100%);
            color: #fff;
            box-shadow: 0 12px 30px rgba(110, 123, 255, 0.2);
        }

        .button:hover {
            transform: translateY(-1px);
        }

        .button-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #c0c9df;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .button-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .chat-shell {
            display: flex;
            flex-direction: column;
            background: #000;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        .status-strip {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: #000;
        }

        .status-strip .title {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .status-strip h2 {
            font-size: 1rem;
            margin: 0;
        }

        .status-strip p {
            margin: 0;
            color: #8e9fb6;
            font-size: 0.75rem;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e6edf8;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .close-btn {
            background: transparent;
            border: none;
            color: #e6edf8;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }

        .chat-body {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .bubble {
            display: flex;
            max-width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
            border: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bubble.user {
            background: #10a37f;
            color: #fff;
            margin-left: auto;
            border-radius: 12px;
            max-width: 80%;
        }

        .bubble.bot {
            background: rgba(255, 255, 255, 0.05);
            color: #dbe3f4;
            border-radius: 12px;
            max-width: 100%;
        }

        .bubble h3 {
            margin: 0 0 6px 0;
            color: #9dadf5;
            font-size: 0.9rem;
            display: none;
        }

        .bubble code {
            display: block;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            background: rgba(20, 20, 25, 0.9);
            color: #cbd5ee;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .bubble a {
            color: #10a37f;
            text-decoration: none;
        }

        .typing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #7e92ff;
            animation: pulse 1.1s infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes pulse {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-4px); opacity: 1; }
        }

        .prompt-pane {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 20px;
            background: #000;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin: 0 auto;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .prompt-pane input {
            flex: 1;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #eef2ff;
            padding: 12px 16px;
            font-size: 0.95rem;
        }

        .prompt-pane input:focus {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .prompt-pane button {
            min-width: 100px;
        }

        .upload-status {
            font-size: 0.8rem;
            color: #a5b1d3;
        }

        @media (max-width: 1080px) {
            .interface {
                grid-template-columns: 1fr;
                height: auto;
            }

            .panel {
                max-height: 200px;
                padding: 12px;
            }
        }

        @media (max-width: 720px) {
            body {
                padding: 8px;
            }

            .interface {
                border-radius: 12px;
                grid-template-columns: 1fr;
                height: auto;
            }

            .panel {
                padding: 12px;
                max-height: 150px;
            }

            .prompt-pane {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .prompt-pane button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="interface">
        <section class="panel" id="sidebarPanel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <div class="brand" style="margin: 0; padding-bottom: 0; border-bottom: none;">
                    <h1 style="font-size: 1.2rem; margin: 0;">Prometheus</h1>
                </div>
                <button class="close-btn" id="closeBtn">✕</button>
            </div>

            <div class="section">
                <h2>Mode</h2>
                <div class="field">
                    <select id="modeSelect">
                        <option value="Chat">Chat</option>
                        <option value="Summarize">Summarize</option>
                        <option value="Explain">Explain</option>
                        <option value="Code Review">Code Review</option>
                        <option value="Answer">Answer</option>
                    </select>
                </div>
            </div>

            <div class="section">
                <h2>Context</h2>
                <div class="field">
                    <select id="useContextToggle">
                        <option value="true">Enabled</option>
                        <option value="false">Disabled</option>
                    </select>
                </div>
            </div>

            <div class="section">
                <h2>System prompt</h2>
                <div class="field" style="margin-bottom: 0;">
                    <textarea id="systemPrompt" placeholder="Custom instructions..." style="min-height: 60px;"></textarea>
                </div>
            </div>

            <div class="section">
                <h2>Session</h2>
                <div class="status-chip" style="font-size: 0.7rem; padding: 6px 10px;">
                    <span id="sessionIdDisplay" style="word-break: break-all; font-size: 0.65rem;"></span>
                </div>
                <div class="actions">
                    <button class="button-secondary" id="clearConvoBtn">Clear chat</button>
                    <button class="button-secondary" id="resetSessionBtn">Reset</button>
                    <button class="button-secondary" id="clearMemoryBtn">Clear memory</button>
                </div>
            </div>

            <div class="section">
                <h2>Upload</h2>
                <div class="field" style="margin-bottom: 8px;">
                    <input type="file" id="uploadFile" accept="application/pdf, text/plain" />
                </div>
                <button class="button" id="uploadBtn" style="width: 100%;">Upload</button>
                <div class="upload-status" id="uploadStatus"></div>
            </div>
        </section>

        <section class="chat-shell">
            <div class="status-strip">
                <button class="menu-btn" id="menuBtn">☰</button>
                <div class="title">
                    <h2>Prometheus AI</h2>
                </div>
                <div style="width: 36px;"></div>
            </div>

            <div class="chat-body">
                <div class="chat-container" id="chatContainer">
                    <div class="bubble bot welcome-message">
                        <p>Ask me anything. Use the menu (☰) for settings, modes, and document upload.</p>
                    </div>
                </div>
            </div>

            <div class="prompt-pane">
                <input id="messageInput" type="text" placeholder="Type your message here..." autocomplete="off" />
                <button class="button" id="sendBtn">Send</button>
            </div>
        </section>
    </div>

    <script>
        // Menu toggle
        const sidebarPanel = document.getElementById('sidebarPanel');
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');

        menuBtn.addEventListener('click', () => {
            sidebarPanel.classList.add('show');
        });

        closeBtn.addEventListener('click', () => {
            sidebarPanel.classList.remove('show');
        });

        // Close sidebar when clicking outside
        document.addEventListener('click', (e) => {
            if (!sidebarPanel.contains(e.target) && !menuBtn.contains(e.target) && sidebarPanel.classList.contains('show')) {
                sidebarPanel.classList.remove('show');
            }
        });

        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const modeSelect = document.getElementById('modeSelect');
        const useContextToggle = document.getElementById('useContextToggle');
        const systemPromptInput = document.getElementById('systemPrompt');
        const sessionIdDisplay = document.getElementById('sessionIdDisplay');
        const clearConvoBtn = document.getElementById('clearConvoBtn');
        const resetSessionBtn = document.getElementById('resetSessionBtn');
        const clearMemoryBtn = document.getElementById('clearMemoryBtn');
        const uploadFile = document.getElementById('uploadFile');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadStatus = document.getElementById('uploadStatus');

        const sessionIdKey = 'prometheus_ai_session_id';
        let sessionId = localStorage.getItem(sessionIdKey) || generateSessionId();
        let lastPrompt = '';
        let lastMessageElement = null;

        localStorage.setItem(sessionIdKey, sessionId);
        sessionIdDisplay.textContent = sessionId;

        messageInput.focus();

        sendBtn.addEventListener('click', sendMessage);
        clearConvoBtn.addEventListener('click', clearConversation);
        resetSessionBtn.addEventListener('click', resetSession);
        clearMemoryBtn.addEventListener('click', clearSessionMemory);
        uploadBtn.addEventListener('click', uploadDocument);
        messageInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey && !isLoading) {
                event.preventDefault();
                sendMessage();
            }
        });

        let isLoading = false;

        function generateSessionId() {
            return crypto?.randomUUID?.() || `${Math.random().toString(36).slice(2)}-${Date.now()}`;
        }

        function renderMarkdown(text) {
            const escaped = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            return escaped
                .replace(/```([\s\S]*?)```/g, (match, code) => `<pre><code>${code.trim()}</code></pre>`)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n\n+/g, '<br><br>')
                .replace(/\n/g, '<br>')
                .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        }

        function addMessage(content, sender) {
            const bubble = document.createElement('div');
            bubble.className = `bubble ${sender}`;
            if (sender === 'bot') {
                const label = document.createElement('h3');
                label.textContent = 'Prometheus';
                bubble.appendChild(label);
            }

            const contentDiv = document.createElement('div');
            contentDiv.innerHTML = renderMarkdown(content);
            bubble.appendChild(contentDiv);
            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return bubble;
        }

        function addTypingIndicator() {
            const bubble = document.createElement('div');
            bubble.className = 'bubble bot';
            bubble.style.justifyContent = 'center';
            bubble.innerHTML = `<div class="typing-indicator"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return bubble;
        }

        async function sendMessage() {
            const prompt = messageInput.value.trim();
            if (!prompt || isLoading) return;

            removeWelcomeMessage();
            addMessage(prompt, 'user');
            messageInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            isLoading = true;
            lastPrompt = prompt;

            const typingIndicator = addTypingIndicator();
            lastMessageElement = null;

            const payload = {
                session_id: sessionId,
                prompt,
                system_prompt: systemPromptInput.value.trim() || undefined,
                use_context: useContextToggle.value === 'true',
                mode: modeSelect.value || undefined,
            };

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    throw new Error(`Server responded with ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    assistantText += chunk;

                    if (!lastMessageElement) {
                        typingIndicator.remove();
                        lastMessageElement = addMessage('', 'bot');
                    }
                    lastMessageElement.querySelector('div').innerHTML = renderMarkdown(assistantText);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            } catch (error) {
                typingIndicator.remove();
                addMessage(`❌ ${error.message}`, 'bot');
            } finally {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                isLoading = false;
                messageInput.focus();
            }
        }

        function clearConversation() {
            chatContainer.innerHTML = '';
            chatContainer.appendChild(createWelcomeBubble());
        }

        function resetSession() {
            sessionId = generateSessionId();
            localStorage.setItem(sessionIdKey, sessionId);
            sessionIdDisplay.textContent = sessionId;
            addStatus('Session reset, conversation cleared. New session created.', 'info');
            clearConversation();
        }

        async function clearSessionMemory() {
            try {
                const resp = await fetch('/session/clear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId }),
                });
                if (!resp.ok) {
                    throw new Error(`Server responded ${resp.status}`);
                }
                addStatus('Session memory cleared.', 'success');
                clearConversation();
            } catch (error) {
                addStatus(`Unable to clear memory: ${error.message}`, 'error');
            }
        }

        function createWelcomeBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'bubble bot welcome-message';
            bubble.innerHTML = `<p>Ask me anything. Use the menu (☰) for settings.</p>`;
            return bubble;
        }

        async function uploadDocument() {
            const file = uploadFile.files[0];
            if (!file) {
                addStatus('Select a file before uploading.', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            uploadStatus.textContent = 'Uploading...';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    throw new Error(`Upload failed with ${response.status}`);
                }

                const data = await response.json();
                uploadStatus.textContent = `✅ ${data.message}`;
            } catch (error) {
                uploadStatus.textContent = `❌ ${error.message}`;
            }
        }

        function addStatus(message, type = 'info') {
            uploadStatus.textContent = message;
            uploadStatus.style.color = type === 'error' ? '#fecdca' : '#d2dbf1';
            uploadStatus.style.background = type === 'error' ? 'rgba(191, 90, 90, 0.15)' : 'rgba(255, 255, 255, 0.04)';
            uploadStatus.style.border = type === 'error' ? '1px solid rgba(255, 55, 55, 0.2)' : '1px solid rgba(255, 255, 255, 0.08)';
        }

        function removeWelcomeMessage() {
            const welcomeMessage = chatContainer.querySelector('.welcome-message');
            if (welcomeMessage) {
                welcomeMessage.remove();
            }
        }
    </script>
</body>
</html>
