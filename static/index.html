<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Master AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #0f0f0f;
            --surface:   #181818;
            --surface2:  #222222;
            --border:    rgba(255,255,255,0.07);
            --border2:   rgba(255,255,255,0.11);
            --text:      #e8e8e8;
            --muted:     #7a7a7a;
            --muted2:    #555;
            --accent:    #cc7a3a;
            --accent-dim:rgba(204,122,58,0.15);
            --user-bg:   #2a2a2a;
            --radius:    14px;
            --sidebar-w: 280px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'Outfit', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ── OVERLAY ── */
        #overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(2px);
            z-index: 99;
        }
        #overlay.active { display: block; }

        /* ── SIDEBAR ── */
        #sidebarPanel {
            position: fixed;
            top: 0; left: 0;
            width: var(--sidebar-w);
            height: 100%;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0;
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.25s cubic-bezier(.4,0,.2,1);
            overflow-y: auto;
        }
        #sidebarPanel.show { transform: translateX(0); }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-brand {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.01em;
        }
        .sidebar-brand span {
            display: inline-block;
            width: 8px; height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 8px;
            position: relative;
            top: -1px;
        }

        #closeBtn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            line-height: 1;
            transition: color 0.15s, background 0.15s;
        }
        #closeBtn:hover { color: var(--text); background: var(--surface2); }

        .sidebar-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }

        .s-section {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
        }
        .s-section h3 {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .s-field { margin-bottom: 8px; }
        .s-field:last-child { margin-bottom: 0; }

        .s-field label {
            display: block;
            font-size: 0.72rem;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .s-field select,
        .s-field textarea,
        .s-field input[type="text"] {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 8px;
            color: var(--text);
            padding: 8px 10px;
            font-size: 0.82rem;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: border-color 0.15s;
            appearance: none;
        }
        .s-field select:focus,
        .s-field textarea:focus { border-color: var(--accent); }
        .s-field textarea { min-height: 70px; resize: vertical; }

        .session-id-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.62rem;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .s-btn-group { display: flex; flex-direction: column; gap: 6px; }
        .s-btn {
            border: 1px solid var(--border2);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            font-size: 0.8rem;
            font-family: 'Outfit', sans-serif;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            text-align: left;
        }
        .s-btn:hover { background: var(--surface2); border-color: var(--border2); }

        .s-upload-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="file"] {
            font-size: 0.76rem;
            color: var(--muted);
            background: var(--surface);
            border: 1px dashed var(--border2);
            border-radius: 8px;
            padding: 8px 10px;
            cursor: pointer;
            width: 100%;
        }
        input[type="file"]::-webkit-file-upload-button {
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 5px;
            color: var(--text);
            font-size: 0.72rem;
            padding: 3px 8px;
            cursor: pointer;
            margin-right: 8px;
            font-family: 'Outfit', sans-serif;
        }

        .upload-btn-primary {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            font-family: 'Outfit', sans-serif;
            padding: 9px;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .upload-btn-primary:hover { opacity: 0.88; }

        #uploadStatus {
            font-size: 0.75rem;
            color: var(--muted);
            padding: 6px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 7px;
            display: none;
        }
        #uploadStatus:not(:empty) { display: block; }

        /* ── MAIN SHELL ── */
        .chat-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ── TOP BAR ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 56px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0;
        }

        .topbar-left { display: flex; align-items: center; gap: 12px; }

        #menuBtn {
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            background: none;
            border: 1px solid var(--border2);
            border-radius: 8px;
            color: var(--muted);
            cursor: pointer;
            font-size: 15px;
            transition: background 0.15s, color 0.15s;
        }
        #menuBtn:hover { background: var(--surface); color: var(--text); }

        .topbar-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
        }
        .topbar-title span { color: var(--muted); font-weight: 400; }

        .topbar-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            color: var(--muted);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 10px;
        }
        .topbar-pill .dot {
            width: 6px; height: 6px;
            background: #3d9e6b;
            border-radius: 50%;
        }

        /* ── CHAT BODY ── */
        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 32px 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--surface2) transparent;
        }
        .chat-body::-webkit-scrollbar { width: 5px; }
        .chat-body::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 10px; }

        .chat-inner {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* ── MESSAGES ── */
        .msg-row {
            display: flex;
            gap: 14px;
            animation: msgIn 0.22s ease both;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* User */
        .msg-row.user {
            justify-content: flex-end;
        }
        .msg-row.user .bubble {
            background: var(--user-bg);
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--text);
            border-radius: 18px 18px 4px 18px;
            padding: 10px 16px;
            max-width: 72%;
            font-size: 0.9rem;
        }

        /* Bot */
        .msg-row.bot {
            align-items: flex-start;
        }
        .bot-avatar {
            width: 28px; height: 28px;
            flex-shrink: 0;
            background: var(--accent-dim);
            border: 1px solid rgba(204,122,58,0.25);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px;
            margin-top: 2px;
        }
        .msg-row.bot .bubble {
            color: var(--text);
            font-size: 0.9rem;
            max-width: 100%;
            padding: 4px 0;
            flex: 1;
        }

        /* Welcome */
        .welcome-msg {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 20px 0 8px;
        }
        .welcome-msg .welcome-body h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }
        .welcome-msg .welcome-body p {
            font-size: 0.85rem;
            color: var(--muted);
        }

        /* Markdown inside bubbles */
        .bubble code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            background: var(--surface2);
            padding: 2px 5px;
            border-radius: 4px;
            color: #c89b6e;
        }
        .bubble pre {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            margin: 10px 0;
            overflow-x: auto;
        }
        .bubble pre code {
            background: none;
            padding: 0;
            color: #d4d4d4;
            font-size: 0.82rem;
        }
        .bubble a { color: var(--accent); text-decoration: none; }
        .bubble a:hover { text-decoration: underline; }
        .bubble strong { font-weight: 600; }
        .bubble em { font-style: italic; color: var(--muted2); }

        /* Typing dots */
        .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 0;
        }
        .typing-dots span {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--muted2);
            animation: bounce 1.1s infinite ease-in-out;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce {
            0%,100% { transform: translateY(0); opacity: 0.4; }
            50%      { transform: translateY(-5px); opacity: 1; }
        }

        /* ── INPUT AREA ── */
        .input-area {
            flex-shrink: 0;
            padding: 16px 20px 20px;
            background: var(--bg);
            border-top: 1px solid var(--border);
        }
        .input-inner {
            max-width: 720px;
            margin: 0 auto;
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 16px;
            transition: border-color 0.15s;
        }
        .input-inner:focus-within {
            border-color: rgba(204,122,58,0.45);
        }

        #messageInput {
            display: block;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 0.92rem;
            padding: 14px 54px 14px 18px;
            resize: none;
            outline: none;
            min-height: 52px;
            max-height: 180px;
            overflow-y: auto;
            line-height: 1.5;
        }
        #messageInput::placeholder { color: var(--muted); }

        #sendBtn {
            position: absolute;
            right: 10px;
            bottom: 10px;
            width: 34px; height: 34px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.15s, transform 0.1s;
        }
        #sendBtn:hover { opacity: 0.88; transform: scale(1.04); }
        #sendBtn:disabled { opacity: 0.35; cursor: default; transform: none; }
        #sendBtn svg { width: 16px; height: 16px; }

        .input-hint {
            text-align: center;
            font-size: 0.68rem;
            color: var(--muted2);
            margin-top: 10px;
        }

        /* ── SCROLLBAR (global) ── */
        #sidebarPanel::-webkit-scrollbar { width: 4px; }
        #sidebarPanel::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 10px; }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            .chat-body { padding: 20px 12px; }
            .input-area { padding: 12px 12px 16px; }
            .msg-row.user .bubble { max-width: 90%; }
            .topbar-pill { display: none; }
        }
    </style>
</head>
<body>

    <div id="overlay"></div>

    <!-- SIDEBAR -->
    <aside id="sidebarPanel">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <span></span>Forge Master
            </div>
            <button id="closeBtn" title="Close">✕</button>
        </div>

        <div class="sidebar-body">

            <!-- Mode -->
            <div class="s-section">
                <h3>Mode</h3>
                <div class="s-field">
                    <label>Response style</label>
                    <select id="modeSelect">
                        <option value="Chat">Chat</option>
                        <option value="Summarize">Summarize</option>
                        <option value="Explain">Explain</option>
                        <option value="Code Review">Code Review</option>
                        <option value="Answer">Answer</option>
                    </select>
                </div>
            </div>

            <!-- Context -->
            <div class="s-section">
                <h3>Context</h3>
                <div class="s-field">
                    <label>Memory</label>
                    <select id="useContextToggle">
                        <option value="true">Enabled</option>
                        <option value="false">Disabled</option>
                    </select>
                </div>
            </div>

            <!-- System prompt -->
            <div class="s-section">
                <h3>System prompt</h3>
                <div class="s-field">
                    <textarea id="systemPrompt" placeholder="Custom instructions for the model…"></textarea>
                </div>
            </div>

            <!-- Session -->
            <div class="s-section">
                <h3>Session</h3>
                <div class="session-id-box" id="sessionIdDisplay"></div>
                <div class="s-btn-group">
                    <button class="s-btn" id="clearConvoBtn">🗑  Clear conversation</button>
                    <button class="s-btn" id="resetSessionBtn">↺  New session</button>
                    <button class="s-btn" id="clearMemoryBtn">⊘  Clear memory</button>
                </div>
            </div>

            <!-- Upload -->
            <div class="s-section">
                <h3>Upload document</h3>
                <div class="s-upload-area">
                    <input type="file" id="uploadFile" accept="application/pdf,text/plain" />
                    <button class="upload-btn-primary" id="uploadBtn">Upload file</button>
                    <div id="uploadStatus"></div>
                </div>
            </div>

        </div>
    </aside>

    <!-- MAIN -->
    <div class="chat-shell">

        <!-- TOP BAR -->
        <header class="topbar">
            <div class="topbar-left">
                <button id="menuBtn" title="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="17" height="17">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5"/>
                    </svg>
                </button>
                <span class="topbar-title">Forge Master <span>AI</span></span>
            </div>
            <div class="topbar-pill">
                <span class="dot"></span>
                Ready
            </div>
        </header>

        <!-- CHAT -->
        <main class="chat-body">
            <div class="chat-inner" id="chatContainer">
                <div class="welcome-message welcome-msg">
                    <div class="bot-avatar">⚒</div>
                    <div class="welcome-body">
                        <h2>How can I help?</h2>
                        <p>Ask me anything. Open the menu (☰) to set modes, system prompts, and upload documents.</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- INPUT -->
        <div class="input-area">
            <div class="input-inner">
                <textarea
                    id="messageInput"
                    placeholder="Message Forge Master…"
                    autocomplete="off"
                    rows="1"
                ></textarea>
                <button id="sendBtn" title="Send">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3.478 2.405a.75.75 0 0 0-.926.94l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.405Z"/>
                    </svg>
                </button>
            </div>
            <p class="input-hint">Shift + Enter for new line · Enter to send</p>
        </div>

    </div>

    <script>
        /* ── SIDEBAR TOGGLE ── */
        const sidebarPanel = document.getElementById('sidebarPanel');
        const overlay      = document.getElementById('overlay');
        const menuBtn      = document.getElementById('menuBtn');
        const closeBtn     = document.getElementById('closeBtn');

        function openSidebar() {
            sidebarPanel.classList.add('show');
            overlay.classList.add('active');
        }
        function closeSidebar() {
            sidebarPanel.classList.remove('show');
            overlay.classList.remove('active');
        }

        menuBtn.addEventListener('click', openSidebar);
        closeBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);

        /* ── TEXTAREA AUTO-GROW ── */
        const messageInput = document.getElementById('messageInput');
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = messageInput.scrollHeight + 'px';
        });

        /* ── REFS ── */
        const sendBtn         = document.getElementById('sendBtn');
        const modeSelect      = document.getElementById('modeSelect');
        const useContextToggle= document.getElementById('useContextToggle');
        const systemPromptInput = document.getElementById('systemPrompt');
        const sessionIdDisplay  = document.getElementById('sessionIdDisplay');
        const clearConvoBtn   = document.getElementById('clearConvoBtn');
        const resetSessionBtn = document.getElementById('resetSessionBtn');
        const clearMemoryBtn  = document.getElementById('clearMemoryBtn');
        const uploadFile      = document.getElementById('uploadFile');
        const uploadBtn       = document.getElementById('uploadBtn');
        const uploadStatus    = document.getElementById('uploadStatus');
        const chatContainer   = document.getElementById('chatContainer');

        /* ── SESSION ── */
        const sessionIdKey = 'forge_master_ai_session_id';
        let sessionId = localStorage.getItem(sessionIdKey) || generateSessionId();
        localStorage.setItem(sessionIdKey, sessionId);
        sessionIdDisplay.textContent = sessionId;

        let isLoading = false;
        let lastMessageElement = null;

        messageInput.focus();

        /* ── EVENTS ── */
        sendBtn.addEventListener('click', sendMessage);
        clearConvoBtn.addEventListener('click', clearConversation);
        resetSessionBtn.addEventListener('click', resetSession);
        clearMemoryBtn.addEventListener('click', clearSessionMemory);
        uploadBtn.addEventListener('click', uploadDocument);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !isLoading) {
                e.preventDefault();
                sendMessage();
            }
        });

        /* ── UTILS ── */
        function generateSessionId() {
            return crypto?.randomUUID?.() || `${Math.random().toString(36).slice(2)}-${Date.now()}`;
        }

        function renderMarkdown(text) {
            const esc = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            return esc
                .replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n\n+/g, '<br><br>')
                .replace(/\n/g, '<br>')
                .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        }

        function scrollBottom() {
            chatContainer.parentElement.scrollTop = chatContainer.parentElement.scrollHeight;
        }

        /* ── MESSAGE RENDERING ── */
        function addMessage(content, sender) {
            const row = document.createElement('div');
            row.className = `msg-row ${sender}`;

            if (sender === 'bot') {
                const avatar = document.createElement('div');
                avatar.className = 'bot-avatar';
                avatar.textContent = '⚒';
                row.appendChild(avatar);
            }

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = renderMarkdown(content);
            row.appendChild(bubble);
            chatContainer.appendChild(row);
            scrollBottom();
            return row;
        }

        function addTypingIndicator() {
            const row = document.createElement('div');
            row.className = 'msg-row bot';
            row.innerHTML = `
                <div class="bot-avatar">⚒</div>
                <div class="bubble">
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>`;
            chatContainer.appendChild(row);
            scrollBottom();
            return row;
        }

        function removeWelcomeMessage() {
            const w = chatContainer.querySelector('.welcome-message');
            if (w) w.remove();
        }

        function createWelcomeBubble() {
            const div = document.createElement('div');
            div.className = 'welcome-message welcome-msg';
            div.innerHTML = `
                <div class="bot-avatar">⚒</div>
                <div class="welcome-body">
                    <h2>How can I help?</h2>
                    <p>Ask me anything. Open the menu (☰) to set modes, system prompts, and upload documents.</p>
                </div>`;
            return div;
        }

        /* ── SEND ── */
        async function sendMessage() {
            const prompt = messageInput.value.trim();
            if (!prompt || isLoading) return;

            removeWelcomeMessage();
            addMessage(prompt, 'user');

            messageInput.value = '';
            messageInput.style.height = 'auto';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            isLoading = true;
            lastMessageElement = null;

            const typingIndicator = addTypingIndicator();

            const payload = {
                session_id: sessionId,
                prompt,
                system_prompt: systemPromptInput.value.trim() || undefined,
                use_context: useContextToggle.value === 'true',
                mode: modeSelect.value || undefined,
            };

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!response.ok) throw new Error(`Server responded with ${response.status}`);

                const reader  = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    assistantText += decoder.decode(value, { stream: true });

                    if (!lastMessageElement) {
                        typingIndicator.remove();
                        lastMessageElement = addMessage('', 'bot');
                    }
                    lastMessageElement.querySelector('.bubble').innerHTML = renderMarkdown(assistantText);
                    scrollBottom();
                }
            } catch (err) {
                typingIndicator.remove();
                addMessage(`❌ ${err.message}`, 'bot');
            } finally {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                isLoading = false;
                messageInput.focus();
            }
        }

        /* ── CONTROLS ── */
        function clearConversation() {
            chatContainer.innerHTML = '';
            chatContainer.appendChild(createWelcomeBubble());
        }

        function resetSession() {
            sessionId = generateSessionId();
            localStorage.setItem(sessionIdKey, sessionId);
            sessionIdDisplay.textContent = sessionId;
            clearConversation();
            addStatus('New session created.', 'info');
        }

        async function clearSessionMemory() {
            try {
                const resp = await fetch('/session/clear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId }),
                });
                if (!resp.ok) throw new Error(`Server responded ${resp.status}`);
                addStatus('Memory cleared.', 'success');
                clearConversation();
            } catch (err) {
                addStatus(`Unable to clear memory: ${err.message}`, 'error');
            }
        }

        async function uploadDocument() {
            const file = uploadFile.files[0];
            if (!file) { addStatus('Select a file first.', 'error'); return; }

            const formData = new FormData();
            formData.append('file', file);
            addStatus('Uploading…', 'info');

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                if (!response.ok) throw new Error(`Upload failed with ${response.status}`);
                const data = await response.json();
                addStatus(`✓ ${data.message}`, 'success');
            } catch (err) {
                addStatus(`✗ ${err.message}`, 'error');
            }
        }

        function addStatus(message, type) {
            uploadStatus.textContent = message;
            uploadStatus.style.color = type === 'error' ? '#f28b7d' : type === 'success' ? '#7dc98e' : '#aaa';
        }
    </script>
</body>
</html>
